<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recenzii - Cactus Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4f1b040aec.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="dist/styles.css">
</head>
<body style="font-family: 'Poppins', sans-serif; background-color: #fdf2b8; color: #333; margin: 0; padding: 20px;">

<header style="display: flex; align-items: center; justify-content: center; padding: 20px; margin-bottom: 20px;">
    <a href="index.html" style="display: flex; align-items: center; gap: 15px; text-decoration: none;">
        <img src="images/logo.png" alt="Logo Cactus Shop" style="height: 60px; width: auto; object-fit: contain;">
        <h1 style="margin: 0; color: #2f694b; font-size: 1.8em;">Cactus Shop</h1>
    </a>
</header>

<div style="max-width: 700px; margin: 0 auto;">

    <h2 id="reviews-title" style="color: #2f694b; text-align: center;">Recenzii</h2>

    <!-- Formular de trimitere — vizibil doar dacă ești logat -->
    <div id="review-form-container" style="display: none; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 2px solid #2f694b; margin-bottom: 30px;">
        <h3 style="color: #2f694b; margin-top: 0;">Lasă o recenzie</h3>

        <div id="star-picker" style="font-size: 2em; margin-bottom: 15px; cursor: pointer;">
            <span class="star" data-value="1">☆</span><span class="star" data-value="2">☆</span><span class="star" data-value="3">☆</span><span class="star" data-value="4">☆</span><span class="star" data-value="5">☆</span>
        </div>

        <textarea id="review-comment" placeholder="Scrie părerea ta..." rows="4" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #2f694b; border-radius: 4px; font-family: inherit; margin-bottom: 15px;"></textarea>

        <button id="submit-review-btn" style="background-color: #2f694b; color: #fdf2b8; border: none; padding: 12px 20px; border-radius: 4px; font-weight: bold; cursor: pointer;">
            Trimite Recenzia
        </button>
        <p id="review-form-message" style="margin-top: 10px; display: none;"></p>
    </div>

    <!-- Mesaj pentru cei nelogați -->
    <div id="login-prompt" style="display: none; background: white; padding: 20px; border-radius: 8px; text-align: center; border: 2px solid #2f694b; margin-bottom: 30px;">
        <p style="margin: 0 0 10px 0;">Trebuie să fii autentificat ca să lași o recenzie.</p>
        <a href="cont.html" style="color: #2f694b; font-weight: bold;">Autentifică-te →</a>
    </div>

    <!-- Lista de recenzii aprobate -->
    <div id="reviews-list"></div>

</div>

<div style="text-align: center; margin-top: 30px;">
    <a href="index.html" style="color: #2f694b; text-decoration: none; font-weight: bold;"><i class="fa-solid fa-arrow-left"></i> Înapoi la magazin</a>
</div>

<script src="../../../../../dist/shared.js"></script>
<script src="../../../../../dist/reviews.js"></script>
</body>
</html>
