<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comenzile mele - Cactus Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4f1b040aec.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="dist/styles.css">
</head>
<body style="font-family: 'Poppins', sans-serif; background-color: #fdf2b8; color: #333; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column;">

<!-- Header -->
<header style="display: flex; align-items: center; justify-content: center; padding: 20px; border-bottom: 2px solid rgba(47, 105, 75, 0.1);">
    <a href="index.html" style="display: flex; align-items: center; gap: 15px; text-decoration: none;">
        <img src="images/logo.png" alt="Logo" style="height: 60px; width: auto; object-fit: contain;">
        <h1 style="margin: 0; color: #2f694b; font-size: 1.8em;">Cactus Shop</h1>
    </a>
</header>

<main style="flex-grow: 1; padding: 40px 20px;">
    <div style="max-width: 700px; margin: 0 auto;">

        <h2 style="color: #2f694b; text-align: center; margin-bottom: 30px;">
            <i class="fa-solid fa-box"></i> Comenzile Mele
        </h2>

        <!-- Tab-uri: Istoric / Verificare -->
        <div style="display: flex; margin-bottom: 25px; background: #f5f0d8; border-radius: 8px; padding: 4px;">
            <button id="tab-history" style="flex: 1; padding: 10px; background: #2f694b; border: none; cursor: pointer; font-weight: bold; color: #fdf2b8; border-radius: 6px; font-family: 'Poppins', sans-serif;">
                <i class="fa-solid fa-clock-rotate-left"></i> Istoric comenzi
            </button>
            <button id="tab-lookup" style="flex: 1; padding: 10px; background: transparent; border: none; cursor: pointer; font-weight: bold; color: #999; border-radius: 6px; font-family: 'Poppins', sans-serif;">
                <i class="fa-solid fa-magnifying-glass"></i> Verifica comanda
            </button>
        </div>

        <!-- Panou Istoric -->
        <div id="history-panel">
            <div id="history-logged-in" style="display: none;">
                <div id="orders-list"></div>
            </div>
            <div id="history-not-logged" style="text-align: center; padding: 40px 20px;">
                <i class="fa-solid fa-lock" style="font-size: 2.5em; color: #ccc; margin-bottom: 15px;"></i>
                <p style="color: #666; margin-bottom: 20px;">Trebuie sa fii logat pentru a vedea istoricul comenzilor.</p>
                <a href="cont.html" style="background-color: #2f694b; color: #fdf2b8; padding: 12px 30px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block;">
                    <i class="fa-solid fa-right-to-bracket"></i> Autentificare
                </a>
            </div>
        </div>

        <!-- Panou Verificare (guest) -->
        <div id="lookup-panel" style="display: none;">
            <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 2px solid #2f694b;">
                <p style="color: #555; margin-top: 0;">Introdu codul comenzii si emailul folosit la plasare.</p>
                <div style="position: relative; margin-bottom: 12px;">
                    <i class="fa-solid fa-hashtag" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #2f694b;"></i>
                    <input type="text" id="lookup-order-token" placeholder="Codul comenzii" style="width: 100%; padding: 12px 12px 12px 38px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                </div>
                <div style="position: relative; margin-bottom: 18px;">
                    <i class="fa-solid fa-envelope" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #2f694b;"></i>
                    <input type="email" id="lookup-email" placeholder="Email folosit la comanda" style="width: 100%; padding: 12px 12px 12px 38px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                </div>
                <button id="lookup-btn" style="width: 100%; background-color: #2f694b; color: #fdf2b8; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Poppins', sans-serif;">
                    <i class="fa-solid fa-magnifying-glass"></i> Verifica
                </button>
                <div id="lookup-result" style="margin-top: 20px;"></div>
            </div>
        </div>

    </div>
</main>

<div style="text-align: center; margin-bottom: 25px;">
    <a href="index.html" style="color: #2f694b; text-decoration: none; font-weight: bold;">
        <i class="fa-solid fa-arrow-left"></i> Inapoi la magazin
    </a>
</div>

<footer style="text-align: center; padding: 20px; color: #2f694b; font-weight: bold; border-top: 1px solid rgba(47, 105, 75, 0.1); font-size: 0.85em;">
    &copy; 2026 Cactus Shop. Toate drepturile rezervate.
</footer>

<script src="dist/shared.js"></script>
<script src="dist/orders.js"></script>
</body>
</html>
