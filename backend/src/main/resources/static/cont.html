<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contul meu - Cactus Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4f1b040aec.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="dist/styles.css">
    <link rel="icon" href="images/logo.png" type="image/png">
</head>
<body style="font-family: 'Poppins', sans-serif; background-color: #fdf2b8; color: #333; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column;">

<!-- Header -->
<header style="display: flex; align-items: center; justify-content: center; padding: 20px; border-bottom: 2px solid rgba(47, 105, 75, 0.1);">
    <a href="index.html" style="display: flex; align-items: center; gap: 15px; text-decoration: none;">
        <img src="images/logo.png" alt="Logo" style="height: 60px; width: auto; object-fit: contain;">
        <h1 style="margin: 0; color: #2f694b; font-size: 1.8em;">Cactus Shop</h1>
    </a>
</header>

<main style="flex-grow: 1; padding: 40px 20px;">
    <div style="max-width: 440px; margin: 0 auto;">

        <!-- Card principal -->
        <div style="background: white; padding: 35px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); border: 2px solid #2f694b;">

            <!-- Iconiță mare sus -->
            <div style="text-align: center; margin-bottom: 25px;">
                <div style="width: 70px; height: 70px; background: #2f694b; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-user" style="color: #fdf2b8; font-size: 1.8em;"></i>
                </div>
            </div>

            <!-- Tab-uri Login / Înregistrare -->
            <div style="display: flex; margin-bottom: 25px; background: #f5f0d8; border-radius: 8px; padding: 4px;">
                <button id="tab-login" class="account-tab" style="flex: 1; padding: 10px; background: #2f694b; border: none; cursor: pointer; font-weight: bold; color: #fdf2b8; border-radius: 6px; font-family: 'Poppins', sans-serif;">
                    <i class="fa-solid fa-right-to-bracket"></i> Autentificare
                </button>
                <button id="tab-register" class="account-tab" style="flex: 1; padding: 10px; background: transparent; border: none; cursor: pointer; font-weight: bold; color: #999; border-radius: 6px; font-family: 'Poppins', sans-serif;">
                    <i class="fa-solid fa-user-plus"></i> Cont Nou
                </button>
            </div>

            <!-- Formular Login -->
            <div id="login-panel">
                <div style="position: relative; margin-bottom: 12px;">
                    <i class="fa-solid fa-envelope" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #2f694b;"></i>
                    <input type="email" id="login-email" placeholder="Email" style="width: 100%; padding: 12px 12px 12px 38px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                </div>
                <div style="position: relative; margin-bottom: 18px;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #2f694b;"></i>
                    <input type="password" id="login-password" placeholder="Parolă" style="width: 100%; padding: 12px 12px 12px 38px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                </div>
                <button id="login-submit-btn" style="width: 100%; background-color: #2f694b; color: #fdf2b8; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; font-family: 'Poppins', sans-serif;">
                    <i class="fa-solid fa-arrow-right"></i> Autentificare
                </button>
                <p id="login-error" style="color: #d32f2f; margin-top: 10px; display: none; font-size: 0.9em; text-align: center;"></p>
            </div>

            <!-- Formular Înregistrare -->
            <div id="register-panel" style="display: none;">
                <div style="position: relative; margin-bottom: 12px;">
                    <i class="fa-solid fa-user" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #2f694b;"></i>
                    <input type="text" id="register-name" placeholder="Nume complet" style="width: 100%; padding: 12px 12px 12px 38px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                </div>
                <div style="position: relative; margin-bottom: 12px;">
                    <i class="fa-solid fa-envelope" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #2f694b;"></i>
                    <input type="email" id="register-email" placeholder="Email" style="width: 100%; padding: 12px 12px 12px 38px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                </div>
                <div style="position: relative; margin-bottom: 12px;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #2f694b;"></i>
                    <input type="password" id="register-password" placeholder="Parolă (minim 8 caractere)" style="width: 100%; padding: 12px 12px 12px 38px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                </div>
                <div style="position: relative; margin-bottom: 18px;">
                    <i class="fa-solid fa-location-dot" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #2f694b;"></i>
                    <input type="text" id="register-address" placeholder="Adresă de livrare" style="width: 100%; padding: 12px 12px 12px 38px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                </div>
                <button id="register-submit-btn" style="width: 100%; background-color: #2f694b; color: #fdf2b8; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; font-family: 'Poppins', sans-serif;">
                    <i class="fa-solid fa-user-plus"></i> Creează Cont
                </button>
                <p id="register-error" style="color: #d32f2f; margin-top: 10px; display: none; font-size: 0.9em; text-align: center;"></p>
            </div>

            <!-- Panou logat -->
            <div id="logged-in-panel" style="display: none;">
                <div style="text-align: center; margin-bottom: 20px;">
                    <h2 style="color: #2f694b; margin: 0;">Bun venit, <span id="logged-in-name"></span>!</h2>
                </div>

                <div style="background: #f8f4e0; border-radius: 10px; padding: 20px; margin-bottom: 15px;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
                        <i class="fa-solid fa-user" style="color: #2f694b; width: 20px; text-align: center;"></i>
                        <span><strong>Nume:</strong> <span id="profile-name"></span></span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 18px;">
                        <i class="fa-solid fa-envelope" style="color: #2f694b; width: 20px; text-align: center;"></i>
                        <span><strong>Email:</strong> <span id="profile-email"></span></span>
                    </div>

                    <label style="font-weight: bold; color: #2f694b; font-size: 0.9em;">
                        <i class="fa-solid fa-location-dot"></i> Adresă de livrare
                    </label>
                    <input type="text" id="profile-address" style="width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 12px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                    <button id="save-address-btn" style="width: 100%; background-color: #2f694b; color: #fdf2b8; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Poppins', sans-serif;">
                        <i class="fa-solid fa-floppy-disk"></i> Salvează adresa
                    </button>
                    <p id="profile-message" style="margin-top: 8px; display: none; font-size: 0.9em; text-align: center;"></p>
                </div>

                <button id="logout-btn" style="width: 100%; background-color: #d32f2f; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Poppins', sans-serif;">
                    <i class="fa-solid fa-right-from-bracket"></i> Deconectare
                </button>
            </div>
        </div>

        <!-- Link înapoi -->
        <div style="text-align: center; margin-top: 25px;">
            <a href="index.html" style="color: #2f694b; text-decoration: none; font-weight: bold;">
                <i class="fa-solid fa-arrow-left"></i> Înapoi la magazin
            </a>
        </div>
    </div>
</main>

<!-- Footer -->
<footer style="text-align: center; padding: 20px; color: #2f694b; font-weight: bold; border-top: 1px solid rgba(47, 105, 75, 0.1); font-size: 0.85em;">
    &copy; 2026 Cactus Shop. Toate drepturile rezervate.
</footer>

<script src="dist/shared.js"></script>
<script src="dist/account.js"></script>
</body>
</html>
