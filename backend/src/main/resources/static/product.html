<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produs - Cactus Shop</title>
    <meta name="description" content="Detalii produs — Cactus Shop.">
    <meta property="og:type" content="product">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4f1b040aec.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="dist/styles.css">
    <link rel="icon" href="images/logo.png" type="image/png">
</head>
<body style="font-family: 'Poppins', sans-serif; background-color: #fdf2b8; color: #333; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column;">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 15px 30px; border-bottom: 2px solid rgba(47, 105, 75, 0.1);">
    <a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
        <img src="images/logo.png" alt="Logo" style="height: 50px;">
        <h1 style="margin: 0; color: #2f694b; font-size: 1.5em;">Cactus Shop</h1>
    </a>
    <a href="shop.html" style="color: #2f694b; text-decoration: none; font-weight: bold;">
        <i class="fa-solid fa-arrow-left"></i> Înapoi la magazin
    </a>
</header>

<main style="flex-grow: 1; padding: 30px 20px;">
    <div id="product-loading" style="text-align: center; padding: 60px;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 2em; color: #2f694b;"></i>
        <p style="color: #666; margin-top: 10px;">Se încarcă produsul...</p>
    </div>

    <div id="product-content" style="display: none; max-width: 1000px; margin: 0 auto;">
        <!-- Produs -->
        <div style="display: flex; flex-wrap: wrap; gap: 30px; margin-bottom: 40px;">
            <div style="flex: 1 1 400px;">
                <img id="product-image" src="" alt="" style="width: 100%; max-height: 500px; object-fit: cover; border-radius: 12px; border: 2px solid #2f694b; cursor: zoom-in;">
            </div>
            <div style="flex: 1 1 350px;">
                <span id="product-category" style="background: #2f694b; color: #fdf2b8; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; font-weight: bold;"></span>
                <h2 id="product-name" style="color: #2f694b; margin: 15px 0 10px; font-size: 2em;"></h2>
                <p id="product-price" style="color: #d32f2f; font-size: 1.8em; font-weight: 900; margin: 0 0 10px;"></p>
                <p id="product-stock" style="font-size: 0.9em; margin: 0 0 8px;"></p>
                <p id="product-location" style="font-size: 0.9em; color: #666; margin: 0 0 20px;"></p>
                <p id="product-desc" style="color: #555; line-height: 1.7; margin: 0 0 25px;"></p>
                <div style="display: flex; gap: 10px;">
                    <button id="product-add-cart" style="flex: 1; padding: 14px; background: #2f694b; color: #fdf2b8; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; font-family: 'Poppins', sans-serif;">
                        <i class="fa-solid fa-cart-plus"></i> Adaugă în coș
                    </button>
                    <button id="product-wishlist" style="padding: 14px 18px; background: white; border: 2px solid #2f694b; border-radius: 8px; font-size: 1.2em; cursor: pointer;">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Recenzii produs -->
        <div style="margin-bottom: 40px;">
            <h3 style="color: #2f694b; margin-bottom: 15px;"><i class="fa-solid fa-star"></i> Recenzii pentru acest produs</h3>
            <div id="product-reviews"></div>
        </div>

        <!-- Produse similare -->
        <div>
            <h3 style="color: #2f694b; margin-bottom: 15px;"><i class="fa-solid fa-seedling"></i> Produse similare</h3>
            <div id="similar-products" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;"></div>
        </div>
    </div>

    <div id="product-error" style="display: none; text-align: center; padding: 60px;">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 2em; color: #d32f2f;"></i>
        <p style="color: #d32f2f; margin-top: 10px;">Produsul nu a fost găsit.</p>
        <a href="shop.html" style="color: #2f694b; font-weight: bold;"><i class="fa-solid fa-arrow-left"></i> Înapoi la magazin</a>
    </div>
</main>

<footer style="text-align: center; padding: 20px; color: #2f694b; font-weight: bold; border-top: 1px solid rgba(47, 105, 75, 0.1); font-size: 0.85em;">
    &copy; 2026 Cactus Shop. Toate drepturile rezervate.
</footer>

<!-- Zoom Modal -->
<div id="zoom-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; cursor:pointer; align-items:center; justify-content:center;">
    <img id="zoom-img" src="" alt="Zoom" style="max-width:90%; max-height:90%; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.5);">
    <button id="zoom-close" style="position:absolute; top:20px; right:20px; background:white; border:none; width:40px; height:40px; border-radius:50%; font-size:1.2em; cursor:pointer;">
        <i class="fa-solid fa-xmark"></i>
    </button>
</div>

<div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px;"></div>

<button id="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fa-solid fa-arrow-up"></i></button>
<script>window.addEventListener('scroll',()=>{document.getElementById('scroll-top-btn').style.display=window.scrollY>300?'block':'none';});</script>
<script src="dist/shared.js"></script>
<script src="dist/product.js"></script>
</body>
</html>
