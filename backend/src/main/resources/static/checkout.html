<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizare comandă - Cactus Shop</title>
    <meta name="description" content="Finalizează comanda ta pe Cactus Shop.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4f1b040aec.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="dist/styles.css">
    <link rel="icon" href="images/logo.png" type="image/png">
</head>
<body style="font-family: 'Poppins', sans-serif; background-color: #fdf2b8; color: #333; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column;">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 15px 30px; border-bottom: 2px solid rgba(47, 105, 75, 0.1);">
    <a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
        <img src="images/logo.png" alt="Logo" style="height: 50px;">
        <h1 style="margin: 0; color: #2f694b; font-size: 1.5em;">Cactus Shop</h1>
    </a>
    <a href="shop.html" style="color: #2f694b; text-decoration: none; font-weight: bold;">
        <i class="fa-solid fa-arrow-left"></i> Înapoi la magazin
    </a>
</header>

<main style="flex-grow: 1; padding: 30px 20px;">
    <div style="max-width: 800px; margin: 0 auto;">
        <h2 style="color: #2f694b; text-align: center; margin-bottom: 30px;">
            <i class="fa-solid fa-credit-card"></i> Finalizare comandă
        </h2>

        <div style="display: flex; flex-wrap: wrap; gap: 25px;">
            <!-- Sumar coș -->
            <div style="flex: 1 1 350px; background: white; padding: 25px; border-radius: 12px; border: 2px solid #2f694b; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
                <h3 style="color: #2f694b; margin-top: 0; border-bottom: 2px solid #2f694b; padding-bottom: 10px;">
                    <i class="fa-solid fa-cart-shopping"></i> Produsele tale
                </h3>
                <div id="checkout-items"></div>
                <div style="border-top: 2px solid #2f694b; padding-top: 12px; margin-top: 15px; text-align: right;">
                    <span style="font-size: 1.3em; font-weight: 900; color: #d32f2f;">Total: <span id="checkout-total">0</span> RON</span>
                </div>
            </div>

            <!-- Formular -->
            <div style="flex: 1 1 300px; background: white; padding: 25px; border-radius: 12px; border: 2px solid #2f694b; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
                <h3 style="color: #2f694b; margin-top: 0; border-bottom: 2px solid #2f694b; padding-bottom: 10px;">
                    <i class="fa-solid fa-user"></i> Date livrare
                </h3>

                <div id="logged-in-info" style="display: none; background: #f0edd4; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <strong id="checkout-logged-name"></strong>
                </div>

                <div id="checkout-fields">
                    <div style="position: relative; margin-bottom: 12px;">
                        <i class="fa-solid fa-user" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #2f694b;"></i>
                        <input type="text" id="checkout-name" placeholder="Numele tău" style="width: 100%; padding: 12px 12px 12px 38px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                    </div>
                    <div style="position: relative; margin-bottom: 12px;">
                        <i class="fa-solid fa-envelope" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #2f694b;"></i>
                        <input type="email" id="checkout-email" placeholder="Email" style="width: 100%; padding: 12px 12px 12px 38px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                    </div>
                    <div style="position: relative; margin-bottom: 20px;">
                        <i class="fa-solid fa-location-dot" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #2f694b;"></i>
                        <input type="text" id="checkout-address" placeholder="Adresa de livrare" style="width: 100%; padding: 12px 12px 12px 38px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif;">
                    </div>
                </div>

                <button id="submit-order-btn" style="width: 100%; background-color: #2f694b; color: #fdf2b8; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.05em; font-family: 'Poppins', sans-serif;">
                    <i class="fa-solid fa-paper-plane"></i> Trimite Comanda
                </button>

                <div id="checkout-error" style="display: none; color: #d32f2f; text-align: center; margin-top: 10px; font-size: 0.9em;"></div>
            </div>
        </div>

        <!-- Confirmare (apare după plasare) -->
        <div id="order-confirmation" style="display: none; max-width: 500px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; border: 2px solid #2f694b; text-align: center;"></div>
    </div>
</main>

<footer style="text-align: center; padding: 20px; color: #2f694b; font-weight: bold; border-top: 1px solid rgba(47, 105, 75, 0.1); font-size: 0.85em;">
    &copy; 2026 Cactus Shop. Toate drepturile rezervate.
</footer>

<div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px;"></div>

<script src="dist/shared.js"></script>
<script src="dist/checkout.js"></script>
</body>
</html>
