server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cactus_shop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hesoyam}

# Spring Boot va crea sau actualiza automat tabelele in baza de date
# TODO: schimba in 'validate' in productie dupa ce schema e stabila
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aceeasi limita ca in ImageController; cererea include si metadatele multipart.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB